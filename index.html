<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>War for the Crown — Training Plan Deck Finder</title>
<meta name="description" content="Tick the training plan cards you own and get the strongest 5-card decks you can actually build.">
<style>
:root{
  --bg:#0c0d13; --panel:#171923; --panel-2:#20232f; --line:#303444;
  --ink:#f2f1ed; --ink-dim:#aaaebd; --ink-faint:#74798d;
  --accent:#e5b757; --accent-2:#8aa9ff; --accent-ink:#161108;
  --gold:#e0ac4a; --gold-bg:#3a2c11; --gold-line:#6b5218;
  --purple:#b183e8; --purple-bg:#2f2340; --purple-line:#4d3a68;
  --blue:#5fa8e8; --blue-bg:#132c40; --blue-line:#264a68;
  --radius:16px; --shadow:0 20px 55px rgba(0,0,0,.26);
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f4f5f9; --panel:#ffffff; --panel-2:#f7f8fc; --line:#dfe2ec;
    --ink:#1b1d26; --ink-dim:#5b6178; --ink-faint:#868da4;
    --accent:#966614; --accent-2:#2f5fd0; --accent-ink:#ffffff;
    --gold:#8a6410; --gold-bg:#fdf3dc; --gold-line:#e8cf95;
    --purple:#6a3fb0; --purple-bg:#f3ecfd; --purple-line:#d9c6f2;
    --blue:#1c5f96; --blue-bg:#e6f1fb; --blue-line:#bcd9ef;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;background:
    radial-gradient(circle at 12% -8%,rgba(224,172,74,.13),transparent 32rem),
    radial-gradient(circle at 90% 8%,rgba(122,162,255,.11),transparent 30rem),var(--bg);color:var(--ink);
  font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1220px;margin:0 auto;padding:34px 22px 72px}
header{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center;padding:10px 2px 22px}
.crest{display:grid;place-items:center;width:104px;height:104px;filter:drop-shadow(0 14px 16px rgba(0,0,0,.34))}
.crest img{display:block;width:100%;height:100%;object-fit:contain}
.eyebrow{margin:0 0 3px;color:var(--gold);font-size:11px;font-weight:750;letter-spacing:.16em;text-transform:uppercase}
header h1{margin:0 0 5px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(26px,3.2vw,40px);line-height:1.08;letter-spacing:-.025em}
header p{margin:0;color:var(--ink-dim);max-width:68ch}
header a{color:var(--accent)}
.hero-stat{text-align:right;padding-left:22px;border-left:1px solid var(--line)}
.hero-stat b{display:block;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.hero-stat span{display:block;color:var(--ink-faint);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
@media(max-width:700px){header{grid-template-columns:auto 1fr;gap:13px}.hero-stat{display:none}.crest{width:78px;height:78px}}

.layout{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(390px,.92fr);gap:24px;margin-top:14px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr}}

.panel{position:relative;background:linear-gradient(155deg,rgba(255,255,255,.018),transparent 45%),var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);overflow:hidden}
.panel::before{content:"";position:absolute;inset:0 0 auto;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);pointer-events:none}
.panel + .panel{margin-top:18px}
.panel h2{margin:0 0 4px;font-family:Georgia,"Times New Roman",serif;font-size:20px;letter-spacing:-.01em;color:var(--ink)}
.sub{margin:0 0 14px;color:var(--ink-faint);font-size:13px}
.result-column{position:sticky;top:18px}
@media(max-width:900px){.result-column{position:static}}

/* ---- picker ---- */
.tier{margin-bottom:20px}
.tier:last-child{margin-bottom:0}
.tier-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.tier-name{font-weight:650;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.tier-name.Gold{color:var(--gold)} .tier-name.Purple{color:var(--purple)} .tier-name.Blue{color:var(--blue)}
.tier-head button{margin-left:auto}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.card{
  position:relative;text-align:left;cursor:pointer;display:flex;align-items:center;gap:9px;
  background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
  min-height:72px;padding:9px 11px;color:var(--ink);font:inherit;transition:transform .16s,background .16s,border-color .16s,box-shadow .16s;
}
.card:hover{border-color:var(--ink-faint);transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.18)}
.card:focus-visible,button:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.card img{
  width:54px;height:54px;flex:0 0 auto;border-radius:10px;display:block;object-fit:cover;
  border:1px solid rgba(255,255,255,.14);background:#2a2c38;
  box-shadow:0 5px 13px rgba(0,0,0,.32),inset 0 0 0 1px rgba(255,255,255,.06);
}
.card.Gold img{border-color:rgba(224,172,74,.42)}
.card.Purple img{border-color:rgba(177,131,232,.42)}
.card.Blue img{border-color:rgba(95,168,232,.42)}
.card[aria-pressed="true"] img{box-shadow:0 7px 17px rgba(0,0,0,.38),0 0 0 1px currentColor}
.card .txt{min-width:0}
.card .nm{display:block;font-weight:600;font-size:13.5px;padding-right:16px}
.card .st{display:block;font-size:11.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums;margin-top:1px}
.card .tick{position:absolute;top:7px;right:8px;width:14px;height:14px;border:1.5px solid var(--line);border-radius:4px}
.card[aria-pressed="true"] .tick{border-color:currentColor;background:currentColor}
.card[aria-pressed="true"] .tick::after{
  content:"";position:absolute;inset:0;background:var(--panel);
  clip-path:polygon(20% 52%,42% 74%,82% 26%,90% 36%,42% 90%,12% 60%);
}
.card.Gold[aria-pressed="true"]{background:var(--gold-bg);border-color:var(--gold-line);color:var(--gold)}
.card.Purple[aria-pressed="true"]{background:var(--purple-bg);border-color:var(--purple-line);color:var(--purple)}
.card.Blue[aria-pressed="true"]{background:var(--blue-bg);border-color:var(--blue-line);color:var(--blue)}
.card[aria-pressed="true"] .nm{color:var(--ink)}

button.mini{
  background:transparent;border:1px solid var(--line);color:var(--ink-dim);
  border-radius:6px;padding:3px 8px;font:inherit;font-size:12px;cursor:pointer;
}
button.mini:hover{color:var(--ink);border-color:var(--ink-faint)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:17px;padding-top:15px;border-top:1px solid var(--line)}
.actions .primary{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}

/* ---- controls ---- */
.controls{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint)}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{
  background:var(--panel-2);border:0;border-right:1px solid var(--line);
  color:var(--ink-dim);font:inherit;font-size:13px;padding:6px 13px;cursor:pointer;
}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}

/* ---- results ---- */
.count{color:var(--ink-dim);font-size:13px;margin:0 0 12px}
.count b{color:var(--ink);font-variant-numeric:tabular-nums}
ol.decks{list-style:none;margin:0;padding:0}
ol.decks li{
  display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;
  position:relative;padding:13px 6px;border-top:1px solid var(--line);transition:background .15s;
}
ol.decks li:first-child{border-top:0}
ol.decks li:not(.empty):hover{background:rgba(255,255,255,.025)}
ol.decks li:first-child:not(.empty){margin:0 -8px 5px;padding:16px 14px;border:1px solid var(--gold-line);border-radius:12px;background:linear-gradient(120deg,var(--gold-bg),transparent 72%)}
ol.decks li:first-child .rank{color:var(--gold);font-weight:800}
ol.decks li:first-child .score b{color:var(--gold);font-size:20px}
ol.decks li.empty{display:block;border-top:0}
.rank{font-variant-numeric:tabular-nums;color:var(--ink-faint);font-size:13px;text-align:right}
.deck-body{min-width:0}
.chips{display:flex;flex-wrap:nowrap;gap:4px;max-width:100%;overflow-x:auto;padding:2px 1px 5px;scrollbar-width:thin}
.chip{
  flex:0 0 auto;font-size:11.5px;padding:2px 7px;border-radius:999px;border:1px solid transparent;white-space:nowrap;
}
.chip.Gold{background:var(--gold-bg);border-color:var(--gold-line);color:var(--gold)}
.chip.Purple{background:var(--purple-bg);border-color:var(--purple-line);color:var(--purple)}
.chip.Blue{background:var(--blue-bg);border-color:var(--blue-line);color:var(--blue)}
.meta{margin-top:4px;font-size:12px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.score{text-align:right;font-variant-numeric:tabular-nums}
.score b{display:block;font-size:18px;font-weight:750;letter-spacing:-.02em}
.score span{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em}

.empty{color:var(--ink-dim);padding:8px 0}
.upgrades{display:flex;flex-direction:column;gap:7px}
.upg{display:flex;align-items:baseline;gap:9px;font-size:13.5px}
.upg .delta{margin-left:auto;color:var(--accent);font-variant-numeric:tabular-nums;font-weight:600}
footer{margin-top:34px;color:var(--ink-faint);font-size:12.5px;line-height:1.7}
footer a{color:var(--ink-dim)}
@media(max-width:560px){
  .wrap{padding:22px 14px 48px}.panel{padding:16px}.grid{grid-template-columns:1fr 1fr;gap:7px}
  .card{min-height:64px;padding:7px;gap:8px}.card img{width:46px;height:46px;border-radius:8px}.card .nm{font-size:12.5px}.card .st{font-size:10.5px}
  ol.decks li{grid-template-columns:25px minmax(0,1fr);gap:8px}.score{grid-column:2;text-align:left;display:flex;align-items:baseline;gap:7px}.score b{font-size:17px}
}
@media(prefers-reduced-motion:reduce){.card,ol.decks li{transition:none}.card:hover{transform:none}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="crest" aria-hidden="true">
    <img src="crown-medal-logo.png" alt="">
  </div>
  <div>
    <div class="eyebrow">Training Plan Optimizer</div>
    <h1>War for the Crown</h1>
    <p>Choose the plan cards you own and uncover the strongest five-card decks available to you.</p>
  </div>
  <div class="hero-stat"><b>42,504</b><span>Decks analyzed</span></div>
</header>

<div class="layout">

  <div>
    <section class="panel">
      <h2>Your cards</h2>
      <p class="sub" id="ownedLine">None selected.</p>
      <div id="picker"></div>
      <div class="actions">
        <button class="mini" id="selAll">Select all 24</button>
        <button class="mini" id="selNone">Clear</button>
        <button class="mini primary" id="copyLink">Copy shareable link</button>
      </div>
    </section>

    <section class="panel" id="upgradePanel" hidden>
      <h2>Best card to chase next</h2>
      <p class="sub">How much your best deck would improve if you unlocked one more card.</p>
      <div class="upgrades" id="upgrades"></div>
    </section>
  </div>

  <div class="result-column">
    <section class="panel">
      <h2>Best decks</h2>
      <div class="controls">
        <div class="field">
          <label>Show</label>
          <div class="seg" id="topN">
            <button data-v="5">Top 5</button>
            <button data-v="10">Top 10</button>
            <button data-v="15">Top 15</button>
          </div>
        </div>
      </div>
      <p class="count" id="count" style="margin-top:14px"></p>
      <ol class="decks" id="results"></ol>
    </section>
  </div>

</div>

<footer id="footer"></footer>
</div>

<script src="data.js?v=04527c279f"></script>
<script>
(function(){
  var D = window.WOTC;
  if(!D){ document.getElementById('results').innerHTML =
    '<li class="empty">data.js failed to load — run <code>python3 build_web_data.py</code>.</li>'; return; }

  var CARDS = D.cards, N = CARDS.length;
  var TIERS = ['Gold','Purple','Blue'];
  var nf = new Intl.NumberFormat('en-US');

  var owned = 0;          // bitmask of cards the player has
  var topN = 10;

  /* ---------- restore selection: URL hash wins, then localStorage ---------- */
  function readInitial(){
    var h = location.hash.replace(/^#/,'');
    if(/^[0-9a-z]+$/.test(h)){
      var v = parseInt(h,36);
      if(!isNaN(v) && v >= 0 && v < (1<<N)) return v;
    }
    try{
      var s = localStorage.getItem('wotc.owned');
      if(s !== null){ var m = parseInt(s,10); if(!isNaN(m)) return m; }
    }catch(e){}
    return 0;          // first visit: nothing ticked, so the page asks before it answers
  }

  function persist(){
    try{ localStorage.setItem('wotc.owned', String(owned)); }catch(e){}
    history.replaceState(null,'', owned ? '#'+owned.toString(36) : location.pathname);
  }

  /* ---------- picker ---------- */
  var picker = document.getElementById('picker');
  var buttons = [];
  TIERS.forEach(function(tier){
    var idxs = [];
    for(var i=0;i<N;i++) if(CARDS[i].r === tier) idxs.push(i);

    var sec = document.createElement('div'); sec.className = 'tier';
    var head = document.createElement('div'); head.className = 'tier-head';
    head.innerHTML = '<span class="tier-name '+tier+'">'+tier+'</span>';
    var all = document.createElement('button');
    all.className = 'mini'; all.textContent = 'All '+tier.toLowerCase();
    all.onclick = function(){
      var mask = 0; idxs.forEach(function(i){ mask |= 1<<i; });
      owned = (owned & mask) === mask ? (owned & ~mask) : (owned | mask);
      render();
    };
    head.appendChild(all); sec.appendChild(head);

    var grid = document.createElement('div'); grid.className = 'grid';
    idxs.forEach(function(i){
      var c = CARDS[i];
      var b = document.createElement('button');
      b.className = 'card ' + tier;
      b.type = 'button';
      b.title = c.e;
      b.innerHTML = '<span class="tick"></span>' +
                    (c.img ? '<img alt="" src="' + c.img + '">' : '') +
                    '<span class="txt"><span class="nm"></span>' +
                    '<span class="st">' + c.s + ' STR / ' + c.t + ' TECH</span></span>';
      b.querySelector('.nm').textContent = c.n;
      b.onclick = function(){ owned ^= (1<<i); render(); };
      grid.appendChild(b);
      buttons[i] = b;
    });
    sec.appendChild(grid);
    picker.appendChild(sec);
  });

  /* ---------- segmented controls ---------- */
  function seg(id, initial, cb){
    var el = document.getElementById(id);
    el.addEventListener('click', function(ev){
      var b = ev.target.closest('button'); if(!b) return;
      cb(b.dataset.v); render();
    });
    return function(cur){
      [].forEach.call(el.children, function(b){
        b.setAttribute('aria-pressed', String(b.dataset.v === String(cur)));
      });
    };
  }
  var paintTopN = seg('topN','10', function(v){ topN = +v; });

  document.getElementById('selAll').onclick  = function(){ owned = (1<<N)-1; render(); };
  document.getElementById('selNone').onclick = function(){ owned = 0; render(); };
  document.getElementById('copyLink').onclick = function(){
    var btn = this, url = location.href;
    var done = function(){ btn.textContent = 'Copied'; setTimeout(function(){ btn.textContent='Copy shareable link'; },1400); };
    if(navigator.clipboard) navigator.clipboard.writeText(url).then(done, done); else done();
  };

  /* ---------- search ---------- */
  // Decks are pre-sorted by average power -- the only ranking on offer, since a
  // deck's max is a lucky roll rather than something a player can aim at -- so
  // the scan can stop as soon as it has enough hits.
  function search(ownedMask, want){
    var mask = D.mask, out = [];
    for(var i=0;i<mask.length && out.length<want;i++)
      if((mask[i] & ~ownedMask) === 0) out.push(i);
    return out;
  }

  function countBuildable(ownedMask){
    var mask = D.mask, n = 0;
    for(var i=0;i<mask.length;i++) if((mask[i] & ~ownedMask) === 0) n++;
    return n;
  }

  function bestScore(ownedMask){
    var mask = D.mask;
    for(var i=0;i<mask.length;i++) if((mask[i] & ~ownedMask) === 0) return D.score[i];
    return 0;
  }

  function popcount(x){ var n=0; while(x){ x &= x-1; n++; } return n; }

  /* ---------- render ---------- */
  function deckRow(i, place){
    var li = document.createElement('li');

    var rank = document.createElement('div');
    rank.className = 'rank'; rank.textContent = '#' + place;

    var body = document.createElement('div'); body.className = 'deck-body';
    var chips = document.createElement('div'); chips.className = 'chips';
    var m = D.mask[i];
    for(var k=0;k<N;k++) if(m & (1<<k)){
      var s = document.createElement('span');
      s.className = 'chip ' + CARDS[k].r;
      s.textContent = CARDS[k].n;
      s.title = CARDS[k].e;
      chips.appendChild(s);
    }
    body.appendChild(chips);

    var meta = document.createElement('div'); meta.className = 'meta';
    var bits = [];
    bits.push('range ' + nf.format(D.lo[i]) + '&ndash;' + nf.format(D.hi[i]));
    bits.push('overall #' + nf.format(i + 1));
    meta.innerHTML = bits.join(' &middot; ');
    body.appendChild(meta);

    var score = document.createElement('div'); score.className = 'score';
    score.innerHTML = '<b>' + nf.format(D.score[i]) + '</b><span>avg power</span>';

    li.appendChild(rank); li.appendChild(body); li.appendChild(score);
    return li;
  }

  function renderUpgrades(){
    var panel = document.getElementById('upgradePanel');
    var box = document.getElementById('upgrades');
    var have = popcount(owned);
    if(have < 5 || have === N){ panel.hidden = true; return; }

    var base = bestScore(owned), rows = [];
    for(var i=0;i<N;i++){
      if(owned & (1<<i)) continue;
      var s = bestScore(owned | (1<<i));
      if(s > base) rows.push({i:i, gain:s - base, to:s});
    }
    if(!rows.length){ panel.hidden = true; return; }
    rows.sort(function(a,b){ return b.gain - a.gain; });

    box.innerHTML = '';
    rows.slice(0,3).forEach(function(r){
      var d = document.createElement('div'); d.className = 'upg';
      var c = CARDS[r.i];
      d.innerHTML = '<span class="chip ' + c.r + '"></span>' +
                    '<span style="color:var(--ink-faint)">best deck &rarr; ' + nf.format(r.to) + '</span>' +
                    '<span class="delta">+' + nf.format(Math.round(r.gain)) + '</span>';
      d.querySelector('.chip').textContent = c.n;
      d.querySelector('.chip').title = c.e;
      box.appendChild(d);
    });
    panel.hidden = false;
  }

  function render(){
    persist();
    for(var i=0;i<N;i++) buttons[i].setAttribute('aria-pressed', String(!!(owned & (1<<i))));
    paintTopN(topN);

    var have = popcount(owned);
    document.getElementById('ownedLine').textContent =
      have === 0 ? 'Nothing selected yet — tick the cards you own.' :
      have + ' of ' + N + ' cards selected.';

    var list = document.getElementById('results');
    var count = document.getElementById('count');
    list.innerHTML = '';

    if(have < 5){
      count.textContent = '';
      var li = document.createElement('li'); li.className = 'empty';
      li.textContent = 'Pick at least 5 cards to see deck suggestions.';
      list.appendChild(li);
      document.getElementById('upgradePanel').hidden = true;
      return;
    }

    var buildable = countBuildable(owned);
    count.innerHTML = '<b>' + nf.format(buildable) + '</b> buildable deck' +
      (buildable === 1 ? '' : 's') + ' out of ' + nf.format(D.nDecks) + '.';

    search(owned, topN).forEach(function(idx, k){
      list.appendChild(deckRow(idx, k + 1));
    });
    renderUpgrades();
  }

  var a = D.accuracy;
  document.getElementById('footer').innerHTML =
    'Power = total Strength &times; total Technique after every plan effect resolves. ' +
    'Card order is randomised every session, so decks are ranked by <b>average power</b> &mdash; the ' +
    'same average the game shows on its own training screen, so you can check any deck here against ' +
    'your own. The range beside each deck is the full spread the game can display; the high end is a ' +
    'lucky roll, not something you can aim at, which is why nothing is ranked by it.<br>' +
    'Numbers are computed with the game’s own Training Plan logic, extracted from the client ' +
    '(' + nf.format(D.nDecks) + ' decks)' +
    (a ? '. On all ' + a.n + ' decks measured in-game it reproduces the displayed min, max and ' +
         'average exactly.' : '.') +
    ' For decks with Airdrop or Destiny the exact number shifts a little with how you order the ' +
    'five slots; the figure shown is the average over all orderings.';

  owned = readInitial();
  render();
})();
</script>

<!-- Traffic counts. No cookies, no identifiers, no consent banner. count.js reports
     location.pathname + location.search only, so the card selection this page keeps
     in the URL fragment is never sent. Append #toggle-goatcounter to opt yourself out. -->
<script data-goatcounter="https://greatluke.goatcounter.com/count"
        async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
